name: Validate

on:
  # Branches are checked through their PR; a push of its own only on main.
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Every job here only reads the repository. Declared in the file so that the
# workflow does not depend on the repository or organization default.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6  # master, 17/10/2026

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main, 08/06/2026
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned in requirements-dev.txt, so the CI and /check run the same ruff:
      # a new release cannot turn the CI red on its own.
      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - run: ruff check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python of the minimum Home Assistant (2025.10: 3.13) and the next one.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # I test girano senza Home Assistant installato: conftest.py fornisce gli
      # stub. I test marcati `live` (che richiedono il citofono in rete) sono
      # esclusi dal marker in pyproject.toml. Quelli `slow` (e2e SIP, ~2 min)
      # sono esclusi di default in locale ma qui girano: -m sovrascrive addopts.
      # Coverage (lines + branches) of custom_components/vimar_intercom: the
      # threshold is fail_under in pyproject.toml, below it the job fails.
      - run: python -m pytest tests -m "not live and not media and not browser and not docker" --cov --cov-report=term-missing

  media-browser:
    # A richiesta (workflow_dispatch): media vero (ffmpeg, aiohttp) e la card in
    # Chromium (Playwright). Non a ogni push: minuti e dipendenze pesanti.
    name: pytest -m media / -m browser
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt aiohttp playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -m media
      - run: python -m pytest tests -m browser
