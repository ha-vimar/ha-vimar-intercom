name: vimar-intercom-dev

x-ha-image: &ha-image
  # Official Docker Hub mirror, pinned to Home Assistant 2026.10.1.
  image: homeassistant/home-assistant@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
  environment:
    TZ: UTC
    PYTHONDONTWRITEBYTECODE: "1"

services:
  seed:
    <<: *ha-image
    entrypoint: [python, /dev-tools/seed.py]
    network_mode: none
    volumes:
      - ../.dev-ha:/state
      - .:/dev-tools:ro
    restart: "no"

  homeassistant:
    <<: *ha-image
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ../.dev-ha/config:/config
      - ../custom_components/vimar_intercom:/config/custom_components/vimar_intercom:ro
    networks: [sandbox]
    restart: "no"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s

  web:
    image: nginx@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
    depends_on:
      homeassistant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HA_DEV_PORT:-18123}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [sandbox, web]
    restart: "no"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/]
      interval: 5s
      timeout: 10s
      retries: 12

  bootstrap:
    <<: *ha-image
    environment:
      HA_DEV_PORT: ${HA_DEV_PORT:-18123}
    entrypoint: [python, /dev-tools/bootstrap.py]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ../.dev-ha:/state
      - .:/dev-tools:ro
    networks: [sandbox]
    restart: "no"

networks:
  sandbox:
    internal: true
  web:
