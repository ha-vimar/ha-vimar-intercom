send_command:
  name: Invia comando SIP
  description: >-
    Invia un SIP MESSAGE arbitrario al citofono Vimar (es. OPEN_2F con header
    "Panda: command"). Utile per sperimentare comandi non ancora mappati.
    Solo amministratori.
  fields:
    body:
      name: Comando (body)
      description: Testo del comando, es. OPEN_2F
      required: true
      example: OPEN_2F
      selector:
        text:
    target:
      name: Destinatario
      description: >-
        ID SIP della targa o del monitor, o URI sip completo. Vuoto = l'SGA
        configurato nelle opzioni.
      example: "55001"
      selector:
        text:
    header_name:
      name: Header extra (nome)
      description: Nome dell'header SIP aggiuntivo (vuoto per nessuno)
      default: Panda
      selector:
        text:
    header_value:
      name: Header extra (valore)
      default: command
      selector:
        text:

call:
  name: Chiama
  description: Avvia una chiamata SIP verso una targa/monitor.
  fields:
    target:
      name: Destinatario
      description: ID SIP della targa o del monitor. Vuoto = l'SGA configurato.
      example: "55001"
      selector:
        text:

answer:
  name: Rispondi
  description: Risponde alla chiamata in arrivo.

hangup:
  name: Riaggancia
  description: Termina la chiamata attiva.

open_door:
  name: Apri porta
  description: Invia il comando di apertura (OPEN_2F) alla targa indicata.
  fields:
    target:
      name: Targa
      description: >-
        ID SIP della targa che apre. Vuoto = la targa della porta configurata
        nelle opzioni (o l'SGA, se non è configurata).
      example: "55001"
      selector:
        text:
    command:
      name: Comando
      default: OPEN_2F
      selector:
        text:

fetch_local:
  name: Fetch HTTP locale
  description: >-
    GET (Digest sipID/password) verso l'interfaccia locale del citofono (home
    mode). Solo amministratori.
  fields:
    path:
      name: Path
      required: true
      example: rest/get_info.php?action=status
      selector:
        text:
    save_as:
      name: Salva come (nome file, in /config/vimar_intercom/)
      description: >-
        Solo il nome del file: lettere, cifre, punto, trattino e underscore.
        Il file nasce in /config/vimar_intercom/, non dove indichi tu.
      example: vimar_rubrica.db
      selector:
        text:
    host:
      name: Host (default proxy locale)
      description: >-
        Indirizzo IP privato o di loopback, scritto per esteso. Un nome DNS non
        e' accettato: questa richiesta porta la password SIP in Digest e deve
        restare in LAN.
      selector:
        text:
    scheme:
      name: Schema
      default: http
      selector:
        text:
