# ─────────────────────────────────────────────────────────────────────────────
# Vimar Intercom — card Lovelace "citofono base"
# Video del pianerottolo + pulsanti Rispondi / Apri porta / Riaggancia.
#
# Il riquadro della camera mostra l'ultimo fotogramma salvato, aggiornato una
# volta al secondo: durante una chiamata segue il video, fuori dalle chiamate
# resta sull'ultima immagine (o su quella d'attesa). Aprirlo non chiama nessuno.
#
# NB: questa card non fa nemmeno audio bidirezionale (parlare): l'audio a 2 vie
# richiede una card custom su /audio_ws.
#
# Come si usa: Dashboard → Modifica → aggiungi card → "Manuale" → incolla.
# Aggiusta l'entity della camera se sul tuo HA ha un nome diverso
# (cerca in Strumenti sviluppatore → Stati una entità che inizia con `camera.` e
#  contiene "vimar"/"intercom").
# ─────────────────────────────────────────────────────────────────────────────
type: vertical-stack
cards:
  # Il pianerottolo: un fotogramma al secondo durante la chiamata.
  - type: picture-entity
    entity: camera.vimar_intercom_intercom
    camera_view: live
    show_name: false
    show_state: false

  # Stato squillo/chiamata (facoltativo ma utile)
  - type: entities
    entities:
      # Gli entity_id cambiano con il nome del dispositivo e con l'area: se HA
      # dice "entità non trovata", cercali in Strumenti per sviluppatori → Stati
      # filtrando per "vimar".
      - entity: sensor.vimar_intercom_intercom_stato   # idle / ringing / in_call
        name: Stato citofono
      - entity: sensor.vimar_intercom_intercom_ultimo_chiamante
        name: Ultimo chiamante

  # Pulsanti: usano i SERVIZI dell'integrazione (indipendenti dal nome entità)
  - type: horizontal-stack
    cards:
      - type: button
        name: Rispondi
        icon: mdi:phone
        tap_action:
          action: call-service
          service: vimar_intercom.answer
      - type: button
        name: Apri porta
        icon: mdi:door-open
        tap_action:
          action: call-service
          service: vimar_intercom.open_door
      - type: button
        name: Riaggancia
        icon: mdi:phone-hangup
        tap_action:
          action: call-service
          service: vimar_intercom.hangup
